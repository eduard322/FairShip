SiWCalo:
  targetWidth: 54 #Tungsten width (cm)
  targetHeight: 54 #Tungsten height (cm)
  sensorWidth: 54 #Sensor active area -- width (cm)
  sensorLength: 54 #Sensor active area -- height (cm)
  nLayers: 10 #Number of tungsten + silicon layers
  zPosition: auto #Default: auto -- ~2 cm after SiliconTarget (2838 by eye)
  targetThickness: 2.0 #Tungsten thickness (cm)
  NPixels: 96 # 32*3 because it's 3x3 ASUSs
  targetSpacing: 2.54 #Spacing between pairs of tungsten layers (cm)
  moduleOffset: 0.1 #Spacing between tungsten surface and first silicon layer (cm)
  mtcGap: 1.0 # Design 4 only: gap (cm) between SiWCalo downstream face and MTC upstream face
  copperPlates: # Design 4 only: passive Cu plates above/below SiWCalo filling the Magn5-Magn6 gap
    enabled: true
    width: 54 # full x width (cm), matches SiWCalo targetWidth
    thickness: 10 # y thickness (cm) per plate
